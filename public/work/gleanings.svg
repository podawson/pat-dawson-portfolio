<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gleanings cross-document risk triage</title>
  <desc id="desc">Schedules, drawings, budgets, RFIs and notes are read together. Conflicts are ranked by likely cost and schedule impact, returned with their source trail, and reviewed by a project manager.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#15201d" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#202827"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f3f1eb"/>
  <g fill="#202827">
    <text x="70" y="76" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">GLEANINGS / REASONING ARCHITECTURE</text>
    <text x="70" y="134" font-family="Georgia,serif" font-size="46">Cross-document risk triage</text>
    <text x="70" y="171" font-family="Arial,Helvetica,sans-serif" font-size="17" opacity=".64">The ranking is the product. The project manager remains the decision-maker.</text>
  </g>
  <g transform="translate(70 248)">
    <text x="0" y="0" fill="#202827" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2">01 / DISTINCT RECORDS</text>
    <g transform="translate(0 42)" font-family="Arial,Helvetica,sans-serif">
      <g><rect width="274" height="82" rx="8" fill="#fbfaf6" stroke="#202827"/><path d="M18 22h28M18 31h28M18 40h18" stroke="#cf7658" stroke-width="3"/><text x="67" y="35" fill="#202827" font-size="16" font-weight="700">SCHEDULES</text><text x="67" y="58" fill="#202827" font-size="12" opacity=".54">milestones · dependencies</text></g>
      <g transform="translate(0 102)"><rect width="274" height="82" rx="8" fill="#fbfaf6" stroke="#202827"/><path d="M18 20h31v42H18zM23 27l21 25M44 27L23 52" fill="none" stroke="#78bdc7" stroke-width="2"/><text x="67" y="35" fill="#202827" font-size="16" font-weight="700">DRAWINGS</text><text x="67" y="58" fill="#202827" font-size="12" opacity=".54">scope · geometry · revision</text></g>
      <g transform="translate(0 204)"><rect width="274" height="82" rx="8" fill="#fbfaf6" stroke="#202827"/><path d="M18 58V29M30 58V39M42 58V20" stroke="#d7b83f" stroke-width="6"/><text x="67" y="35" fill="#202827" font-size="16" font-weight="700">BUDGETS</text><text x="67" y="58" fill="#202827" font-size="12" opacity=".54">allowances · actuals · exposure</text></g>
      <g transform="translate(0 306)"><rect width="274" height="82" rx="8" fill="#fbfaf6" stroke="#202827"/><circle cx="32" cy="40" r="18" fill="none" stroke="#8f91c9" stroke-width="2"/><path d="M25 39h14M32 32v14" stroke="#8f91c9" stroke-width="2"/><text x="67" y="35" fill="#202827" font-size="16" font-weight="700">RFIs + NOTES</text><text x="67" y="58" fill="#202827" font-size="12" opacity=".54">questions · decisions · field record</text></g>
    </g>
  </g>
  <g fill="none" stroke="#202827" stroke-width="1.5" opacity=".62" marker-end="url(#arrow)">
    <path d="M344 331C436 331 447 407 516 443"/><path d="M344 433C438 433 454 445 516 460"/><path d="M344 535C438 535 452 495 516 480"/><path d="M344 637C435 637 448 530 516 497"/>
  </g>
  <g transform="translate(516 248)">
    <text x="0" y="0" fill="#202827" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2">02 / READ AGAINST ONE ANOTHER</text>
    <g transform="translate(0 104)" filter="url(#shadow)">
      <path d="M0 60C0 26 26 0 60 0h350c34 0 60 26 60 60v214c0 34-26 60-60 60H60c-34 0-60-26-60-60z" fill="#202827"/>
      <g fill="none" stroke-linecap="round"><path d="M55 87C132 18 192 191 277 111S385 55 421 94" stroke="#cf7658" stroke-width="4"/><path d="M55 151C128 75 205 251 294 163S382 132 421 152" stroke="#78bdc7" stroke-width="4"/><path d="M55 217C145 132 197 294 290 231S379 196 421 218" stroke="#d7b83f" stroke-width="4"/></g>
      <g fill="#f3f1eb" font-family="Arial,Helvetica,sans-serif"><text x="55" y="287" font-size="14" font-weight="700" letter-spacing="1.4">RECONCILE · COMPARE · TRACE</text><text x="55" y="312" font-size="12" opacity=".58">Records stay distinct while consequential disagreement is located.</text></g>
    </g>
    <g transform="translate(18 490)" font-family="Arial,Helvetica,sans-serif">
      <rect width="132" height="34" rx="17" fill="none" stroke="#cf7658"/><text x="66" y="22" text-anchor="middle" fill="#202827" font-size="11" font-weight="700">SCOPE DRIFT</text>
      <rect x="144" width="150" height="34" rx="17" fill="none" stroke="#d7b83f"/><text x="219" y="22" text-anchor="middle" fill="#202827" font-size="11" font-weight="700">BUDGET GAPS</text>
      <rect x="306" width="164" height="34" rx="17" fill="none" stroke="#78bdc7"/><text x="388" y="22" text-anchor="middle" fill="#202827" font-size="11" font-weight="700">DEPENDENCIES</text>
    </g>
  </g>
  <path d="M986 457H1080" fill="none" stroke="#202827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g transform="translate(1080 248)">
    <text x="0" y="0" fill="#202827" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2">03 / RANK WHAT COMPOUNDS</text>
    <g transform="translate(0 66)" font-family="Arial,Helvetica,sans-serif">
      <g filter="url(#shadow)"><rect width="430" height="112" rx="10" fill="#fbfaf6" stroke="#202827"/><rect width="12" height="112" rx="6" fill="#cf7658"/><text x="38" y="42" fill="#202827" font-size="13" font-weight="700" letter-spacing="1">01 / COST + SCHEDULE</text><text x="38" y="73" fill="#202827" font-size="17">Highest likely downstream impact</text><circle cx="387" cy="56" r="23" fill="#202827"/><path d="M376 57l8 8 16-20" fill="none" stroke="#f3f1eb" stroke-width="3"/></g>
      <g transform="translate(28 136)"><rect width="402" height="96" rx="10" fill="#fbfaf6" stroke="#202827"/><rect width="10" height="96" rx="5" fill="#d7b83f"/><text x="35" y="38" fill="#202827" font-size="13" font-weight="700" letter-spacing="1">02 / SOURCE TRAIL</text><text x="35" y="67" fill="#202827" font-size="15">Every finding remains inspectable</text></g>
      <g transform="translate(58 256)"><rect width="372" height="88" rx="10" fill="#fbfaf6" stroke="#202827"/><rect width="9" height="88" rx="4.5" fill="#78bdc7"/><text x="33" y="35" fill="#202827" font-size="13" font-weight="700" letter-spacing="1">03 / NEXT QUESTION</text><text x="33" y="62" fill="#202827" font-size="14">Confirm · dismiss · investigate</text></g>
    </g>
  </g>
  <g transform="translate(1080 720)" font-family="Arial,Helvetica,sans-serif"><rect width="430" height="112" rx="56" fill="#202827"/><text x="215" y="44" text-anchor="middle" fill="#f3f1eb" font-size="12" font-weight="700" letter-spacing="2">HUMAN REVIEW GATE</text><text x="215" y="74" text-anchor="middle" fill="#f3f1eb" font-size="15">Project manager authorizes action</text></g>
  <g transform="translate(70 910)" fill="#202827" font-family="Arial,Helvetica,sans-serif"><text x="0" y="0" font-size="12" font-weight="700" letter-spacing="1.5">PRINCIPLE</text><text x="0" y="31" font-family="Georgia,serif" font-size="24">Surface the three conflicts worth acting on—not every discrepancy the system can find.</text></g>
</svg>
